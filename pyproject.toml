[build-system]
# PEP 639 (`license` as an SPDX string, `license-files`) needs maturin 1.8.
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "iec61850"
# Keep in step with `version` in Cargo.toml: scripts/release.py reads the
# Cargo one to locate the built wheel, and a mismatch makes it find nothing.
version = "0.14.0"
description = "Async-first IEC 61850 client for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Cheng Sin Pang" }]
keywords = ["iec61850", "scada", "ics", "mms", "goose", "energy", "ems"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking",
]

[project.urls]
Repository = "https://github.com/csp0924/iec61850-python"
Issues = "https://github.com/csp0924/iec61850-python/issues"
"Rust implementation" = "https://github.com/csp0924/iec61850-rust"

[tool.maturin]
module-name = "iec61850._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
  "cryptography>=42",
  "maturin>=1.8,<2.0",
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "twine>=5",
]
